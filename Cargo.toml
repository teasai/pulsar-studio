[package]
name = "pulsar-studio"
version = "0.11.7"
edition = "2021"
description = "A cross-platform Apache Pulsar management desktop client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/teasai/pulsar-studio"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = "0.29"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
pulsar = { version = "6", default-features = false, features = ["tokio-runtime", "compression"] }
apache-avro = "0.17"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = "0.36"
rmp-serde = "1"
base64 = "0.22"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

# ---- .deb（cargo-deb）----
[package.metadata.deb]
maintainer = "teasai <teasai@foxmail.com>"
copyright = "2026, teasai"
extended-description = "Apache Pulsar management desktop client (resources, topics, messages, subscriptions, policies)"
section = "utility"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0"
assets = [
    ["target/release/pulsar-studio", "usr/bin/", "755"],
    ["assets/app.png", "usr/share/icons/hicolor/256x256/apps/pulsar-studio.png", "644"],
    ["pulsar-studio.desktop", "usr/share/applications/", "644"],
]

# ---- .rpm（cargo-generate-rpm）----
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pulsar-studio", dest = "/usr/bin/pulsar-studio", mode = "755" },
    { source = "assets/app.png", dest = "/usr/share/icons/hicolor/256x256/apps/pulsar-studio.png", mode = "644" },
    { source = "pulsar-studio.desktop", dest = "/usr/share/applications/pulsar-studio.desktop", mode = "644" },
]
