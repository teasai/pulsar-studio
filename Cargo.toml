[package]
name = "pulsar-studio"
version = "0.11.5"
edition = "2021"
description = "A cross-platform Apache Pulsar management desktop client"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = "0.29"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
pulsar = { version = "6", default-features = false, features = ["tokio-runtime", "compression"] }
apache-avro = "0.17"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = "0.36"
rmp-serde = "1"
base64 = "0.22"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
